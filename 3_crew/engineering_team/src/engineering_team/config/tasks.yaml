design_task:
  description: >
    Take the high level requirements and prepare a detailed design for a Flutter completed module;
    include all classes and functions in markdown.
    Here are the requirements: {requirements}
  expected_output: >
    Detailed markdown design with classes and method signatures in the Dart module.
  agent: engineering_lead
  output_file: flutter_app/lib/{module_name}_design.md


code_task:
  description: >
    Write a fully self-contained Dart backend module implementing the design.
    The file must be saved as lib/{module_name}.dart and adhere to the requirements.
    Here are the requirements: {requirements}
  expected_output: >
    Raw Dart code implementing the backend module.
  agent: backend_engineer
  context:
    - design_task
  output_file: flutter_app/lib/{module_name}.dart


frontend_task:
  description: >
    Write a complete Flutter app's UI demonstrating the backend in lib/main.dart.
    It must be runnable as a standalone Flutter app.
    Keep UI simple but functional.
    Here are the requirements: {requirements}
  expected_output: >
    Raw Dart code for lib/main.dart of the Flutter app.
  agent: frontend_engineer
  context:
    - code_task
  output_file: flutter_app/lib/main.dart


test_task:
  description: >
    Write unit and widget tests for the backend saved as test/test_{module_name}.dart.
    Ensure tests are runnable with flutter test.
  expected_output: >
    Raw Dart test code.
  agent: test_engineer
  context:
    - code_task
  output_file: flutter_app/test/test_{module_name}.dart
